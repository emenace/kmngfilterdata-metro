<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Kemenag Kota Metro</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="card login-card">
      <div class="header-badge">Kementerian Agama Kota Metro</div>
      <h1 class="login-title">Sign In</h1>
      <p class="login-subtitle">
        Enter the application password to view the employee data dashboard, import files, or generate filtered exports.
      </p>

      <div id="loginError" class="alert alert-error hidden" role="alert">
        <div id="loginErrorMessage" class="alert-body"></div>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="password-input-wrap">
            <input
              id="passwordInput"
              name="password"
              type="password"
              class="text-input password-input"
              placeholder="Enter password"
              autocomplete="current-password"
              required
              autofocus
            />
            <button
              id="togglePasswordBtn"
              type="button"
              class="password-toggle-btn"
              aria-label="Show password"
              aria-pressed="false"
            >
              Show
            </button>
          </div>
        </div>

        <button id="loginSubmitBtn" type="submit" class="btn btn-primary btn-block">
          Unlock App
        </button>
      </form>
    </section>
  </main>

  <script src="/login.js"></script>
</body>
</html>
